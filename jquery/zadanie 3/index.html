        let $licznik = 0;

        $(function(){
          $("#kwadrat").on("click", function(){
            $("#kwadrat").css("background", "red")
            $licznik++
            $("#komunikat").text($licznik)
          })
        });

        $(function(){
          $("#resetuj").on("click", function(){
            $("#kwadrat").css("background", "grey")
            $("#komunikat").text("");
          })
        });




    </script>
      <style>
    #kwadrat { width: 150px; height: 150px; background: lightgray; }
  </style>
</head>
<body>
    <button id="przywitaj">Przywitaj się</button>
    <button id="resetuj">Resetuj</button>
  <p id="komunikat"></p>
 
  <div id="kwadrat"></div>
 
    
</body>
